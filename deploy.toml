# station-web deploy manifest — CLIENT-CONTRACT §5.
#
# station-web is Phase 5 of the 2026-08-10 hf-timestd split: the web UI
# as its own read-only client.  It reads products under /var/lib/timestd
# (frozen root, owned by hf-timestd) and writes nothing there.

[package]
name             = "station-web"
version          = "0.1.0"
description      = "Station data reports and documentation (metrology, ionospheric science, GNSS vTEC)"
contract_version = "0.8"
license          = "MIT"

[contract.config]
init = "scripts/setup-station.sh"
edit = "scripts/config-review.sh"

# scripts/build-venv.sh builds the venv: the core always, the science pages
# (hamsci-dsp, hamsci-physics and their siblings, the [science] extra) only
# where those sibling checkouts exist.  The script names the interpreter.
[build]
steps = [
    "bash scripts/build-venv.sh",
]
produces = ["/opt/git/sigmond/station-web/venv/bin/station-web"]

[install]
user  = "stationweb"
group = "stationweb"

# Only kind = "link" executes in sigmond today.  Directory and config creation
# belong to [contract.config].init (setup-station.sh), which also creates the
# stationweb user when absent.
[[install.steps]]
kind = "link"
src  = "venv/bin/station-web"
dst  = "/usr/local/bin/station-web"

[[install.steps]]
kind = "link"
src  = "systemd/station-web@.service"
dst  = "/etc/systemd/system/station-web@.service"

[[install.steps]]
kind = "link"
src  = "systemd/station-web.service"
dst  = "/etc/systemd/system/station-web.service"

[systemd]
units           = ["station-web.service"]
templated_units = ["station-web@.service"]

# No [[deps.git]]: the core needs no sibling checkout.  The science
# siblings (hamsci-dsp, hamsci-physics, hs-uploader) arrive with the clients
# that own them; scripts/build-venv.sh uses them when present.

[[deps.pypi]]
name    = "fastapi"
version = ">=0.104.0"
venv    = "/opt/git/sigmond/station-web/venv"

# The config this client needs, declared the contract way (kind = "render").
# [contract.config].init (setup-station.sh) still creates the file; this entry
# says which template it comes from, so sigmond can judge `configured` and
# ops' site-capture can record how a site's copy differs from the default.
[[install.steps]]
kind      = "render"
src       = "config/station-web.toml.template"
dst       = "/etc/station-web/config.toml"
mode      = "0644"
if_absent = true
